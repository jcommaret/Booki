<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Redirection</title>
    <meta name="robots" content="noindex" />
    <script>
      // /Booki/documentation?x=1 → /Booki/#/documentation?x=1
      // pathSegmentsToKeep = 1 pour un site de projet (/Booki/)
      var pathSegmentsToKeep = 1
      var l = window.location
      var segments = l.pathname.split('/')
      var base = segments.slice(0, 1 + pathSegmentsToKeep).join('/') + '/'
      var route = segments.slice(1 + pathSegmentsToKeep).join('/')
      l.replace(l.origin + base + '#/' + route + l.search)
    </script>
  </head>
  <body>
    Redirection…
  </body>
</html>
